<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Medura</title>
<meta name="description" content="Medura — interactive Rive experience">
<meta name="color-scheme" content="light">
<meta name="theme-color" content="#e2e1e3">
<meta property="og:title" content="Medura">
<meta property="og:description" content="Medura — interactive Rive experience">
<meta property="og:type" content="website">
<link rel="preload" href="fonts/yekan-bakh-vf.woff2" as="font" type="font/woff2" crossorigin>
<style>
  /* Both faces are the ones the artboard itself is set in, lifted out of the
     .riv and subsetted to Persian + Latin so the HTML around the animation —
     the loader, the errors, the desktop-only notice — is set in the same
     typography rather than in whatever sans-serif the device defaults to.
     Yekan Bakh carries the Persian copy, Space Grotesk the Latin, matching the
     artboard's own split. Both are variable, so one file covers every weight.

     Yekan Bakh's own defaults are Thin ExtraCondensed, so weight and width are
     always stated rather than left to the axis defaults. */
  @font-face {
    font-family: "Yekan Bakh";
    src: url("fonts/yekan-bakh-vf.woff2") format("woff2-variations"),
         url("fonts/yekan-bakh-vf.woff2") format("woff2");
    font-weight: 100 950;
    font-stretch: 62.5% 150%;
    font-style: normal;
    font-display: swap;
  }
  @font-face {
    font-family: "Space Grotesk";
    src: url("fonts/space-grotesk-vf.woff2") format("woff2-variations"),
         url("fonts/space-grotesk-vf.woff2") format("woff2");
    font-weight: 300 700;
    font-style: normal;
    font-display: swap;
  }
  :root {
    /* Sampled from the artboard's own edge, so the letterbox bars around the
       animation are invisible at any aspect ratio. */
    --bg: #e2e1e3;
    --fg: #1b1b20;
    --muted: #63636f;
    --accent: #2563eb;
    --font-fa: "Yekan Bakh", system-ui, -apple-system, "Segoe UI", Tahoma, sans-serif;
    --font-latin: "Space Grotesk", ui-monospace, SFMono-Regular, Menlo, monospace;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    background: var(--bg);
    color: var(--fg);
    font-family: var(--font-fa);
    /* The artboard sets even its body copy bold — nothing in this design is
       lighter than 700 — so that is the baseline here too. */
    font-weight: 700;
    font-stretch: 100%;
    overflow: hidden;
    overscroll-behavior: none;
  }
  #stage {
    position: fixed;
    inset: 0;
    display: block;
  }
  #rive-canvas {
    display: block;
    width: 100%;
    height: 100%;
    touch-action: none;
  }
  #overlay {
    position: fixed;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 18px;
    background: var(--bg);
    text-align: center;
    padding: 24px;
    transition: opacity .45s ease, visibility .45s ease;
  }
  #overlay[hidden] { display: none; }
  #overlay.is-hidden {
    opacity: 0;
    visibility: hidden;
    pointer-events: none;
  }
  .spinner {
    width: 42px;
    height: 42px;
    border-radius: 50%;
    border: 3px solid rgba(0,0,0,.12);
    border-top-color: var(--accent);
    animation: spin 900ms linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  @media (prefers-reduced-motion: reduce) {
    .spinner { animation-duration: 2.4s; }
  }
  .status {
    font-size: 14px;
    color: var(--muted);
    max-width: 46ch;
    line-height: 1.8;
  }
  .bar {
    width: min(280px, 70vw);
    height: 4px;
    border-radius: 999px;
    background: rgba(0,0,0,.10);
    overflow: hidden;
  }
  .bar > i {
    display: block;
    height: 100%;
    width: 0%;
    background: var(--accent);
    border-radius: inherit;
    transition: width .2s ease;
  }
  .error-title {
    font-size: 16px;
    font-weight: 800;
    color: #b42318;
  }
  .retry {
    appearance: none;
    border: 1px solid rgba(0,0,0,.20);
    background: transparent;
    color: var(--fg);
    font: inherit;
    font-size: 14px;
    font-weight: 700;
    padding: 9px 18px;
    border-radius: 999px;
    cursor: pointer;
  }
  .retry:hover { border-color: var(--accent); color: var(--accent); }

  /* Shown instead of the experience on anything that is not a desktop. The
     animation is never loaded in that case, so this is the whole page there. */
  #blocked {
    position: fixed;
    inset: 0;
    display: none;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 20px;
    padding: 32px;
    background: var(--bg);
    text-align: center;
  }
  body.is-blocked #blocked { display: flex; }
  body.is-blocked #stage,
  body.is-blocked #overlay { display: none; }
  #blocked svg { color: var(--accent); }
  #blocked h1 {
    margin: 0;
    font-size: 21px;
    /* The artboard's headings sit at ExtraBold; matching it is what makes this
       screen read as the same product as the one behind it. */
    font-weight: 800;
    line-height: 1.6;
  }
  #blocked p {
    margin: 0;
    max-width: 34ch;
    font-size: 14px;
    line-height: 1.9;
    color: var(--muted);
  }
  #perf {
    position: fixed;
    top: 10px;
    left: 10px;
    z-index: 10;
    padding: 6px 11px;
    border-radius: 7px;
    background: rgba(16,16,22,.82);
    color: #d8f5c8;
    font: 500 12px/1.5 var(--font-latin);
    white-space: nowrap;
    direction: ltr;
    pointer-events: none;
  }
  #blocked code {
    /* The Latin face the artboard uses for its own Latin lockup, so the address
       is set the same way the header's "Prototype V1.0" is. */
    font-family: var(--font-latin);
    font-weight: 500;
    font-size: 13px;
    letter-spacing: .01em;
    background: rgba(0,0,0,.06);
    padding: 4px 10px;
    border-radius: 6px;
    direction: ltr;
    display: inline-block;
  }
</style>
</head>
<body>
  <main id="stage">
    <canvas id="rive-canvas"></canvas>
  </main>

  <div id="overlay" role="status" aria-live="polite">
    <div class="spinner" id="spinner"></div>
    <div class="bar" id="bar"><i></i></div>
    <p class="status" id="status">در حال بارگذاری…</p>
  </div>

  <div id="blocked">
    <svg width="44" height="44" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"
         stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <rect x="2" y="4" width="20" height="13" rx="2"></rect>
      <path d="M8 20h8M12 17v3"></path>
    </svg>
    <h1>به مدورا خوش آمدید</h1>
    <p>مدورا به نمایشگر بزرگ و ماوس نیاز دارد و روی موبایل اجرا نمی‌شود؛ این نشانی را روی کامپیوتر باز کنید.</p>
    <code id="blocked-url">medura-fa.vercel.app</code>
    <button class="retry" type="button" id="copy-url">کپی نشانی</button>
  </div>

<script>
(function () {
  "use strict";

  // Everything is served from this repository — no third-party requests.
  var RIV_URL = "rive/medura_project_v2.riv";

  // The WebGL2 renderer is the one this artboard was designed against. The CPU
  // "canvas" renderer does not blur or feather, so the soft glow behind the body
  // renders as a hard-edged white ellipse and the organs lose their translucency
  // — and it rasterises every pixel on the main thread, which is what made
  // interaction feel sluggish. Canvas is kept only as a fallback for browsers
  // without WebGL2.
  var RENDERERS = [
    {
      name: "webgl2",
      script: "vendor/rive-webgl2/rive.js",
      wasm: "vendor/rive-webgl2/rive.wasm",
      wasmFallback: "vendor/rive-webgl2/rive_fallback.wasm"
    },
    {
      name: "canvas",
      script: "vendor/rive/rive.js",
      wasm: "vendor/rive/rive.wasm",
      wasmFallback: "vendor/rive/rive_fallback.wasm"
    }
  ];

  // The experience is desktop-only: on anything else the runtime and the .riv
  // are never fetched at all and the static notice below takes over the page.
  // Desktop means a real pointing device and a window wide enough for the
  // layout; every phone and tablet falls to the other side.
  //
  // The flag is still pushed to the artboard, which carries its own copy for
  // both cases — it just never sees `false` while it is on screen.
  var DESKTOP_FLAG = "desktop";
  var MIN_DESKTOP_WIDTH = 800;

  function isDesktop() {
    var finePointer = !window.matchMedia || window.matchMedia("(pointer: fine)").matches;
    return finePointer && window.innerWidth >= MIN_DESKTOP_WIDTH;
  }

  // The interactive layer lives in this state machine on the default artboard.
  // It must be named explicitly: with neither `animations` nor `stateMachines`
  // set, the runtime plays the artboard's first *timeline* and only falls back
  // to a state machine when the artboard has no timelines at all — so the file
  // would render, play "Cover" once, freeze, and never respond to input.
  var STATE_MACHINE = "State Machine 1";

  // Fit.Layout resizes the *artboard* to the canvas instead of scaling a fixed
  // 1440x810 board up to it. Two consequences, both wanted here:
  //
  //   Correctness — the file's layout components reflow to the real window, so
  //   nothing stretches and nothing sits in letterbox bars.
  //
  //   Cost — under Fill, a 2560px-wide window magnifies the board 1.8x, and
  //   effect cost does not scale linearly with magnification: blur is
  //   proportional to the square of its radius, and this design leans on large
  //   soft glows. Under Layout the board is laid out at its authored density, so
  //   effects cost the same at any window size. Nothing is rendered at lower
  //   resolution to achieve that.
  var LAYOUT_FIT = "Layout";

  var canvas  = document.getElementById("rive-canvas");
  var overlay = document.getElementById("overlay");
  var spinner = document.getElementById("spinner");
  var statusEl = document.getElementById("status");
  var bar = document.getElementById("bar");
  var barFill = bar.firstElementChild;

  var riveInstance = null;
  var runtimeRequested = false;
  var RENDERER_USED = "";
  var PERF = /(^|[?&])perf(=|&|$)/.test(location.search);

  function setStatus(text) { statusEl.textContent = text; }

  function setProgress(fraction) {
    if (fraction == null) { bar.style.display = "none"; return; }
    bar.style.display = "";
    barFill.style.width = Math.max(0, Math.min(1, fraction)) * 100 + "%";
  }

  function hideOverlay() {
    overlay.classList.add("is-hidden");
    setTimeout(function () { overlay.hidden = true; }, 500);
  }

  function showError(title, detail) {
    overlay.hidden = false;
    overlay.classList.remove("is-hidden");
    spinner.style.display = "none";
    bar.style.display = "none";
    overlay.innerHTML =
      '<p class="error-title"></p>' +
      '<p class="status"></p>' +
      '<button class="retry" type="button">تلاش دوباره</button>';
    overlay.querySelector(".error-title").textContent = title;
    overlay.querySelector(".status").textContent = detail;
    overlay.querySelector(".retry").addEventListener("click", function () {
      location.reload();
    });
  }

  function supportsWebGL2() {
    try {
      return !!document.createElement("canvas").getContext("webgl2");
    } catch (e) {
      return false;
    }
  }

  function loadRuntime(index) {
    index = index || 0;
    if (!index && !supportsWebGL2()) index = 1;

    var renderer = RENDERERS[index];
    if (!renderer) {
      showError("بارگذاری موتور Rive ممکن نشد", "هیچ‌کدام از رندررهای موجود بالا نیامدند.");
      return;
    }

    var script = document.createElement("script");
    script.src = renderer.script;
    script.async = true;
    script.onload = function () {
      if (!window.rive || !window.rive.Rive) { loadRuntime(index + 1); return; }
      RENDERER_USED = renderer.name;
      // Point the runtime at the WebAssembly bundled here rather than its
      // default CDN locations.
      try {
        window.rive.RuntimeLoader.setWasmUrl(new URL(renderer.wasm, location.href).href);
        window.rive.RuntimeLoader.wasmFallbackURL = new URL(renderer.wasmFallback, location.href).href;
      } catch (e) { /* older runtime: CDN defaults still apply */ }
      fetchRiv();
    };
    script.onerror = function () { loadRuntime(index + 1); };
    document.head.appendChild(script);
  }

  // Fetch the .riv ourselves so we can report download progress.
  function fetchRiv() {
    setStatus("در حال دریافت انیمیشن…");
    fetch(RIV_URL, { cache: "force-cache" })
      .then(function (response) {
        if (!response.ok) throw new Error("HTTP " + response.status);

        var total = Number(response.headers.get("content-length")) || 0;
        if (!response.body || !total) { setProgress(null); return response.arrayBuffer(); }

        var reader = response.body.getReader();
        var chunks = [];
        var received = 0;
        return (function pump() {
          return reader.read().then(function (result) {
            if (result.done) {
              var merged = new Uint8Array(received);
              var offset = 0;
              for (var i = 0; i < chunks.length; i++) {
                merged.set(chunks[i], offset);
                offset += chunks[i].length;
              }
              return merged.buffer;
            }
            chunks.push(result.value);
            received += result.value.length;
            setProgress(received / total);
            return pump();
          });
        })();
      })
      .then(startRive)
      .catch(function (err) {
        showError("بارگذاری فایل انیمیشن ممکن نشد", String(err && err.message ? err.message : err));
      });
  }

  function startRive(buffer) {
    setProgress(null);
    setStatus("در حال اجرا…");

    riveInstance = new window.rive.Rive({
      buffer: buffer,
      canvas: canvas,
      autoplay: true,
      stateMachines: STATE_MACHINE,
      // Data-bound view models and the file's own Rive events (cursor changes,
      // open-url actions) are what the artboard was authored against.
      autoBind: true,
      automaticallyHandleEvents: true,
      layout: new window.rive.Layout({
        fit: window.rive.Fit[LAYOUT_FIT],
        alignment: window.rive.Alignment.Center
      }),
      onLoad: function () {
        resize();
        ensureStateMachineRunning();
        applyDesktopFlag();
        hideOverlay();
        document.body.classList.add("is-ready");
        if (PERF) startPerfHud();
      },
      onLoadError: function (err) {
        showError("راه‌اندازی انیمیشن ناموفق بود", String(err || "خطای نامشخص Rive"));
      }
    });
  }

  // The single place that decides whether the experience runs. Called on start
  // and on every resize/orientation change, so a window dragged below the
  // desktop threshold (or a phone rotated) lands on the notice, and going back
  // the other way starts the experience — loading it the first time it is
  // reached, resuming it afterwards.
  function applyDeviceGate() {
    var desktop = isDesktop();
    if (desktop) {
      document.body.classList.remove("is-blocked");
      if (!runtimeRequested) {
        runtimeRequested = true;
        loadRuntime();
      } else if (riveInstance && !document.hidden) {
        try { riveInstance.play(); } catch (e) { /* instance not ready */ }
      }
    } else {
      document.body.classList.add("is-blocked");
      if (riveInstance) {
        try { riveInstance.pause(); } catch (e) { /* instance not ready */ }
      }
    }
    return desktop;
  }

  // Tell the artboard which copy to show. autoBind has already bound the file's
  // default view model, so the property is reachable straight off the instance.
  // Returns false when the file has no such property, which is the signal to
  // fall back to the HTML notice.
  function applyDesktopFlag() {
    try {
      var vmi = riveInstance && riveInstance.viewModelInstance;
      var prop = vmi && vmi.boolean(DESKTOP_FLAG);
      if (!prop) return false;
      prop.value = isDesktop();
      return true;
    } catch (e) {
      return false;
    }
  }

  // Guards against STATE_MACHINE being renamed in the Rive editor: if the named
  // machine did not start, fall back to whatever the artboard actually has.
  function ensureStateMachineRunning() {
    var available = riveInstance.stateMachineNames || [];
    var running = riveInstance.playingStateMachineNames || [];
    if (running.length || !available.length) return;
    riveInstance.stop();
    riveInstance.play(available[0]);
  }


  // Full native resolution: the surface matches the canvas at the display's own
  // pixel ratio, with no budget and no downscaling. Under Fit.Layout this also
  // re-lays out the artboard, so it is debounced rather than run per frame.
  function resize() {
    if (!riveInstance) return;
    riveInstance.resizeDrawingSurfaceToCanvas();
    applyDesktopFlag();
  }

  var resizeTimer = null;
  function scheduleResize() {
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(function () {
      applyDeviceGate();
      resize();
    }, 80);
  }

  window.addEventListener("resize", scheduleResize);
  window.addEventListener("orientationchange", scheduleResize);
  if (window.ResizeObserver) {
    new ResizeObserver(scheduleResize).observe(document.getElementById("stage"));
  }

  // Opt-in perf HUD: append ?perf to the URL. Costs nothing when it is off, and
  // the next round of optimisation is in the .riv rather than in here, so this
  // is what makes the effect of an edit in the Rive editor visible immediately.
  function startPerfHud() {
    var hud = document.createElement("div");
    hud.id = "perf";
    document.body.appendChild(hud);

    var samples = [];
    var last = 0;
    var painted = 0;

    requestAnimationFrame(function tick(now) {
      requestAnimationFrame(tick);
      if (!last) { last = now; return; }
      samples.push(now - last);
      last = now;
      if (samples.length < 20 && now - painted < 500) return;

      var sorted = samples.slice().sort(function (a, b) { return a - b; });
      var median = sorted[sorted.length >> 1];
      var p95 = sorted[Math.min(sorted.length - 1, Math.floor(sorted.length * 0.95))];
      samples.length = 0;
      painted = now;

      hud.textContent =
        Math.round(1000 / median) + " fps   " +
        median.toFixed(1) + " ms (p95 " + p95.toFixed(0) + ")   " +
        canvas.width + "×" + canvas.height + " @" + (window.devicePixelRatio || 1) + "x   " +
        (riveInstance ? Math.round(riveInstance.artboardWidth) + "×" + Math.round(riveInstance.artboardHeight) : "?") +
        " board   " + RENDERER_USED;
    });
  }

  // Pause while the tab is hidden so we do not burn battery in the background.
  document.addEventListener("visibilitychange", function () {
    if (!riveInstance) return;
    try {
      if (document.hidden) riveInstance.pause();
      else if (isDesktop()) riveInstance.play();
    } catch (e) { /* instance not ready */ }
  });

  // Show the address the visitor is actually on, so it can be typed or pasted
  // into a desktop browser. The markup carries the canonical host as fallback.
  (function setUpBlockedNotice() {
    var url = location.origin + location.pathname.replace(/index\.html$/, "");
    document.getElementById("blocked-url").textContent =
      url.replace(/^https?:\/\//, "").replace(/\/$/, "");

    var copy = document.getElementById("copy-url");
    copy.addEventListener("click", function () {
      var done = function () {
        copy.textContent = "کپی شد";
        setTimeout(function () { copy.textContent = "کپی نشانی"; }, 1800);
      };
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(url).then(done, function () {});
      }
    });
  })();

  applyDeviceGate();
})();
</script>
</body>
</html>
