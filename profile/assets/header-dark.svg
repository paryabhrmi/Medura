<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 400" width="1280" height="400" role="img" aria-label="Parya Bahrami, design technologist. Interaction, motion, design systems and front-end. A cubic-bezier easing curve is plotted at the right with a dot tracing it.">
<title>Parya Bahrami — Design Technologist</title>
<style><![CDATA[
  .mono{font-family:ui-monospace,"SF Mono",SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace}
  .sans{font-family:"Helvetica Neue",Helvetica,Arial,"Segoe UI",sans-serif}
  .scan{animation:scan 9s linear infinite}
  @keyframes scan{from{transform:translateX(-60px)}to{transform:translateX(1280px)}}
  .cur{animation:blink 1.1s steps(1,end) infinite}
  @keyframes blink{0%,49.9%{opacity:1}50%,100%{opacity:0}}
  /* The dot travels linearly in x and eased in y, so it traces exactly the
     curve drawn beneath it rather than merely approximating it. */
  .mx{animation:mx 4s infinite}
  @keyframes mx{0%{transform:translateX(0);animation-timing-function:linear}70%,100%{transform:translateX(380px)}}
  .my{animation:my 4s infinite}
  @keyframes my{0%{transform:translateY(0);animation-timing-function:cubic-bezier(.4,0,.2,1)}70%,100%{transform:translateY(-230px)}}
  @media (prefers-reduced-motion:reduce){
    .scan,.cur,.mx,.my{animation:none}
    .scan{opacity:0}
  }
]]></style>

<defs>
  <linearGradient id="sweep" x1="0" x2="1" y1="0" y2="0">
    <stop offset="0" stop-color="#FF6A3D" stop-opacity="0"/>
    <stop offset="1" stop-color="#FF6A3D" stop-opacity="0.14"/>
  </linearGradient>
</defs>

<rect width="1280" height="400" fill="#0D1117"/>
<g stroke="#FFFFFF" stroke-opacity="0.045" stroke-width="1"><path d="M64 0 V400"/><path d="M128 0 V400"/><path d="M192 0 V400"/><path d="M256 0 V400"/><path d="M320 0 V400"/><path d="M384 0 V400"/><path d="M448 0 V400"/><path d="M512 0 V400"/><path d="M576 0 V400"/><path d="M640 0 V400"/><path d="M704 0 V400"/><path d="M768 0 V400"/><path d="M832 0 V400"/><path d="M896 0 V400"/><path d="M960 0 V400"/><path d="M1024 0 V400"/><path d="M1088 0 V400"/><path d="M1152 0 V400"/><path d="M1216 0 V400"/><path d="M0 64 H1280"/><path d="M0 128 H1280"/><path d="M0 192 H1280"/><path d="M0 256 H1280"/><path d="M0 320 H1280"/><path d="M0 384 H1280"/></g>
<g class="scan"><rect x="0" y="0" width="60" height="400" fill="url(#sweep)"/><rect x="59" y="0" width="1.5" height="400" fill="#FF6A3D" opacity="0.28"/></g>
<rect x="0.5" y="0.5" width="1279" height="399" fill="none" stroke="#30363D"/>
<g fill="none" stroke="#30363D" stroke-width="1.5">
  <path d="M20 44 V20 H44"/><path d="M1236 20 H1260 V44"/>
  <path d="M20 356 V380 H44"/><path d="M1236 380 H1260 V356"/>
</g>

<text x="64" y="84" class="mono" font-size="13" letter-spacing="3" fill="#8B949E">PARYABHRMI &#183; DESIGN TECHNOLOGIST &#183; PARYABAHRAMI.IR</text>

<g class="sans" fill="#E6EDF3" font-size="84" font-weight="700" letter-spacing="1">
  <text x="64" y="200" textLength="300" lengthAdjust="spacing">PARYA</text>
  <text x="64" y="282" textLength="430" lengthAdjust="spacing">BAHRAMI</text>
</g>
<rect class="cur" x="510" y="240" width="15" height="44" fill="#FF6A3D"/>
<rect x="64" y="306" width="430" height="5" fill="#FF6A3D"/>
<text x="64" y="346" class="mono" font-size="13" letter-spacing="2" fill="#8B949E">INTERACTION &#183; MOTION &#183; DESIGN SYSTEMS &#183; FRONT-END</text>

<g>
  <text x="800" y="80" class="mono" font-size="13" letter-spacing="2" fill="#8B949E">EASING &#183; cubic-bezier(0.4, 0, 0.2, 1)</text>
  <rect x="800" y="110" width="380" height="230" fill="none" stroke="#FFFFFF" stroke-opacity="0.045" stroke-dasharray="3 5"/>
  <path d="M800 110 V340 H1180" fill="none" stroke="#30363D" stroke-width="1.5"/>
  <g stroke="#FF6A3D" stroke-width="1.2" stroke-dasharray="4 4" opacity="0.75">
    <line x1="800" y1="340" x2="952" y2="340"/>
    <line x1="1180" y1="110" x2="876" y2="110"/>
  </g>
  <g fill="#0D1117" stroke="#FF6A3D" stroke-width="2">
    <circle cx="952" cy="340" r="5"/><circle cx="876" cy="110" r="5"/>
  </g>
  <path d="M800 340 C952 340 876 110 1180 110" fill="none" stroke="#E6EDF3" stroke-width="2.5" stroke-linecap="round"/>
  <g class="mx"><circle class="my" cx="800" cy="340" r="6.5" fill="#FF6A3D"/></g>
  <text x="800" y="366" class="mono" font-size="11" fill="#8B949E">t = 0</text>
  <text x="1180" y="366" class="mono" font-size="11" fill="#8B949E" text-anchor="end">t = 1</text>
</g>
</svg>
