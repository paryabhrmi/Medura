name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
      - master
      - claude/beautiful-knuth-9zhxs4
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let one deployment finish rather than cancelling it mid-flight.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # `enablement` turns Pages on for the repository on the first run, so the
      # site does not need Settings → Pages to be toggled by hand.
      - uses: actions/configure-pages@v5
        with:
          enablement: true

      # The site is plain static files, so the repository root is the artifact.
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - id: deployment
        uses: actions/deploy-pages@v4
