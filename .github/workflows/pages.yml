name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
      - master
      - claude/beautiful-knuth-9zhxs4
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let one deployment finish rather than cancelling it mid-flight.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # This step fails until Pages is switched on once under
      # Settings → Pages → Source: GitHub Actions. The workflow's own token
      # cannot enable it ("Resource not accessible by integration").
      - uses: actions/configure-pages@v5

      # The site is plain static files, so the repository root is the artifact.
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - id: deployment
        uses: actions/deploy-pages@v4
